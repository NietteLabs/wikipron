name: Update WikiPron data
run-name: ${{ github.actor }} Update PT data
on: workflow_dispatch
permissions:
  contents: write
  pages: write
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt update && sudo apt install git python3-pip python3 python3-venv python-is-python3
      - run: python3 -m venv wikipron
      - run: source wikipron/bin/activate
      - name: Check out repository code and install requirements
        uses: actions/checkout@v4
      - run: pip install -U pip setuptools && pip install -r requirements.txt && pip install --no-deps -e .
      - name: Update codes
        run: cd data/scrape/lib && python3 codes.py
      - name: Update Dataset (por)
        run: cd data/scrape/ && ./scrape --restriction='por' && ./postprocess
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: 'Update Codes and por data'
          add: |
            - data/scrape/lib/languages.json
            - data/scrape/summary.tsv 
            - data/scrape/tsv/por*
